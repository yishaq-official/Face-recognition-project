<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        body { background-color: #0a0a0a; color: #00ff41; font-family: 'Courier New', Courier, monospace; }
        .hacker-border { border: 1px solid #00ff41; box-shadow: 0 0 10px #00ff41; }
        .feed-container { position: relative; overflow: hidden; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex justify-between items-center border-b border-green-900 pb-4">
            <h1 class="text-3xl font-bold tracking-tighter uppercase">System: Face_Recognition_v1.0</h1>
            <div id="status-pulse" class="flex items-center gap-2">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                <span class="text-xs uppercase">Live Feed Active</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Main Video Feed -->
            <div class="lg:col-span-2 space-y-4">
                <div class="hacker-border rounded-lg bg-black aspect-video flex items-center justify-center feed-container">
                    <img src="{{ url_for('video_feed') }}" class="w-full h-full object-cover opacity-80" alt="Camera Feed">
                </div>
                <div class="bg-zinc-900 p-4 rounded border border-zinc-800 text-sm">
                    <p class="text-zinc-500">> [LOG] Initializing facial feature extraction...</p>
                    <p class="text-zinc-500">> [LOG] Database connected: MongoDB_Local</p>
                </div>
            </div>

            <!-- Attendance Sidebar -->
            <div class="lg:col-span-1 flex flex-col gap-4">
                <h2 class="text-xl font-bold uppercase border-l-4 border-green-500 pl-2">Recent Logs</h2>
                <div id="attendance-list" class="flex flex-col gap-3 h-[500px] overflow-y-auto pr-2 custom-scrollbar">
                    <!-- Logs will appear here dynamically -->
                    <div class="text-zinc-600 text-center italic mt-10">Waiting for detection...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
